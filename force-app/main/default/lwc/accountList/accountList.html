<template>
    <lightning-card title="Account Details" icon-name="standard:account">

        <!-- Error handling must be OUTSIDE the accounts block,
             otherwise it can never be displayed when the wire call fails. -->
        <template if:true={hasError}>
            <div class="slds-p-around_medium slds-text-color_error">
                <p><strong>{errorTitle}:</strong> {errorMessage}</p>
            </div>
        </template>

        <template if:true={hasAccounts}>
            <template for:each={accounts} for:item="acc">
                <p key={acc.Id} class="slds-p-horizontal_medium slds-p-vertical_x-small">
                    {acc.Name} - {acc.Phone}
                </p>
            </template>
        </template>

        <template if:false={hasAccounts}>
            <template if:false={hasError}>
                <div class="slds-p-around_medium">
                    No Accounts found for industry: {industry}.
                </div>
            </template>
        </template>

    </lightning-card>
</template>
